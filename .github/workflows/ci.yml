name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up March
        uses: march-language/setup-march@main

      # march compiles generated IR by calling bare `clang` from PATH. On macOS
      # that is the runner's system clang, which rejects `memory(none)` (march
      # #716) with "expected top-level entity". setup-march already installs
      # Homebrew LLVM; put it first on PATH. Drop once march#747 (readnone) is
      # in the toolchain setup-march installs.
      - name: Use Homebrew LLVM clang (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      # Keep resolved dependency sources across runs so a forgepm.org outage
      # (tarball downloads returning 502) doesn't fail CI when nothing changed.
      - name: Restore dependency cache
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: ~/.march/cas/deps
          key: forge-deps-${{ runner.os }}-${{ hashFiles('forge.toml', 'forge.lock') }}

      # `forge build` does not resolve dependencies — with an empty CAS on a
      # fresh runner, depot is simply absent and every module it provides
      # reports as unknown ("Unknown module `Pool`. Did you mean `Plot`?").
      # Retry with backoff: registry downloads fail transiently.
      - name: Resolve dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          for attempt in 1 2 3 4; do
            forge deps && exit 0
            echo "forge deps failed (attempt $attempt); retrying in $((attempt * 20))s"
            sleep $((attempt * 20))
          done
          exit 1

      - name: Build
        run: forge build

      - name: Test
        run: forge test --release
