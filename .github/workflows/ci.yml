name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Check out depot
        uses: actions/checkout@v4
        with:
          repository: march-language/depot
          path: ../depot

      - name: Set up March
        uses: march-language/setup-march@main

      - name: Build
        run: forge build

      - name: Test
        run: forge test
